name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test tools
      - run: bun run typecheck
      - run: bun run check
      - run: python tools/trial.py check
      - run: python -m unittest discover -s tools -p test_trial.py -v
